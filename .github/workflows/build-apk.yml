name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare local properties
        run: |
          touch local.properties local.dev.properties

      - name: Prepare CI signing config
        run: |
          {
            echo "NUVIO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/ci/cinemaos-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=cinemaos"
            echo "NUVIO_RELEASE_KEY_PASSWORD=cinemaosdebug"
            echo "NUVIO_RELEASE_STORE_PASSWORD=cinemaosdebug"
          } >> "$GITHUB_ENV"

      - name: Build fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: cinemaos-tv-debug
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          if-no-files-found: error

      - name: Upload ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: cinemaos-tv-debug-abi
          path: |
            app/build/outputs/apk/full/debug/app-full-arm64-v8a-debug.apk
            app/build/outputs/apk/full/debug/app-full-armeabi-v7a-debug.apk
          if-no-files-found: warn
