name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require the CinemaOS release branch
        run: test "$GITHUB_REF" = "refs/heads/cinemaos"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare local properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          : > local.properties
          : > local.dev.properties
          for f in local.properties local.dev.properties; do
            echo "TMDB_API_KEY=$TMDB_API_KEY" >> "$f"
            for name in TRAKT_CLIENT_ID SIMKL_CLIENT_ID MDBLIST_CLIENT_ID INTRODB_API_URL; do
              value="${!name}"
              if [ -n "$value" ]; then
                echo "$name=$value" >> "$f"
              fi
            done
          done

      - name: Prepare CI signing config
        # Must be the key the installed CinemaOS app (com.cinemaos.app) was signed with, or Android
        # refuses the update with "App not installed". No fallback key on purpose.
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "Missing NUVIO_RELEASE_* signing secrets" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          echo "VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Test playback, downloads, ratings and source fallback
        run: |
          ./gradlew :app:testFullDebugUnitTest \
            --tests '*DirectDownloadPolicyTest' \
            --tests '*TraktAuthServiceTest' \
            --tests '*AdaptiveStreamDownloadsTest' \
            --tests '*SettingsCatalogTest' \
            --tests '*PlaybackAvailabilityViewModelTest' \
            --tests '*EpisodeRatingsAlignmentTest' \
            --tests '*AutoPlaySourceFallbackTest' \
            --tests '*SourceFallbackHandoffTest' \
            --tests '*LocalDebridServiceTest' \
            --tests '*BitrateAwareLoadControlTest' \
            --tests '*LanguageLookupCacheTest' \
            --tests '*AddonEventDispatcherTest' \
            --tests '*ContinueWatchingClickActionTest' \
            --tests '*EpisodeAutoPlayLoadingTest' \
            --tests '*HomeEnrichmentRepositoryBoundaryTest' \
            --tests '*HomeEnrichmentRetryTest' \
            --tests '*HomePosterWatchedTest' \
            --tests '*LibraryRepositoryTrackingTest' \
            --tests '*MdbListSyncEngineTest' \
            --tests '*MdbListUserRatingsTest' \
            --tests '*MetaMapperTest' \
            --tests '*ModernHomeIdentityRelocationTest' \
            --tests '*MpvSubtitleTextTest' \
            --tests '*PlayerLetterboxMaskTest' \
            --tests '*PlayerSubtitleUtilsMergeTest' \
            --tests '*PlexAccountClientTest' \
            --tests '*PlexArtworkTest' \
            --tests '*PlexProviderTest' \
            --tests '*ProfileSettingsPluginSyncTest' \
            --tests '*RefusedServerTypesTest' \
            --tests '*ServerDeviceOnlySignInTest' \
            --tests '*ServerRepositoryTest' \
            --tests '*ServerTokenRenewalTest' \
            --tests '*SiloArtworkTest' \
            --tests '*SiloProviderTest' \
            --tests '*SimklRatingsTest' \
            --tests '*StyledSubtitlePresenterTest' \
            --tests '*TmdbMetadataServiceTest' \
            --tests '*TrackingPlaybackScenariosTest' \
            --tests '*TrackingSettingsViewModelTest' \
            --tests '*WatchProgressMetadataRetryTest' \
            --tests '*WatchProgressRepositoryProfileIsolationTest' \
            --tests '*WatchProgressRepositoryProviderMarksTest' \
            --max-workers=2 --stacktrace

      # release build: package com.cinemaos.app, so it installs as an update over the old CinemaOS app
      - name: Build fullRelease APK
        run: ./gradlew :app:assembleFullRelease -PappVersionCode=$VERSION_CODE -PappVersionName=$VERSION_NAME --max-workers=2 --stacktrace

      # the old app's update prompt downloads the asset whose name contains "universal"
      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/full/release
          for abi in universal arm64-v8a armeabi-v7a; do
            mv "app-full-${abi}-release.apk" "CinemaOS-TV-${VERSION_NAME}-${abi}.apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cinemaos-tv-release
          path: app/build/outputs/apk/full/release/CinemaOS-TV-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag --list 'v1.1.*' --sort=-v:refname | head -n 1)
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..HEAD"; else RANGE="-n 8"; fi
          NOTES=$(git log $RANGE --no-merges --pretty='- %s' | head -n 8)
          [ -z "$NOTES" ] && NOTES="- Performance and stability improvements"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          cd app/build/outputs/apk/full/release
          gh release create "v${VERSION_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CinemaOS TV ${VERSION_NAME}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest \
            CinemaOS-TV-*.apk
