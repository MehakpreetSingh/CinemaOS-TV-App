name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare local properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          : > local.properties
          : > local.dev.properties
          for f in local.properties local.dev.properties; do
            echo "TMDB_API_KEY=$TMDB_API_KEY" >> "$f"
            for name in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID MDBLIST_CLIENT_ID INTRODB_API_URL; do
              value="${!name}"
              if [ -n "$value" ]; then
                echo "$name=$value" >> "$f"
              fi
            done
          done

      - name: Prepare CI signing config
        run: |
          {
            echo "NUVIO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/ci/cinemaos-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=cinemaos"
            echo "NUVIO_RELEASE_KEY_PASSWORD=cinemaosdebug"
            echo "NUVIO_RELEASE_STORE_PASSWORD=cinemaosdebug"
          } >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          echo "VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build fullDebug APK
        run: ./gradlew :app:assembleFullDebug -PappVersionCode=$VERSION_CODE -PappVersionName=$VERSION_NAME --stacktrace

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: cinemaos-tv-debug
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          if-no-files-found: error

      - name: Upload ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: cinemaos-tv-debug-abi
          path: |
            app/build/outputs/apk/full/debug/app-full-arm64-v8a-debug.apk
            app/build/outputs/apk/full/debug/app-full-armeabi-v7a-debug.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd app/build/outputs/apk/full/debug
          gh release create "v${VERSION_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CinemaOS TV ${VERSION_NAME}" \
            --notes "CinemaOS TV ${VERSION_NAME} (build ${GITHUB_RUN_NUMBER})" \
            --latest \
            app-full-universal-debug.apk app-full-arm64-v8a-debug.apk app-full-armeabi-v7a-debug.apk
